credits:
- name: Anniversary Free Night
  amount_usd: 150
  period: annual
  category: travel_hotels
  requires_enrollment: false
  expires: null
  notes: 'Automatic each cardmember anniversary, valid 12 months; captured by anyone who takes one IHG
    stay a year. Estimated at ~$150: the award tops out at a 40,000-point redemption ceiling and IHG points
    realistically redeem near 0.4-0.5 cents each (~$160-200 at the ceiling), haircut toward $150 for the
    ceiling not always being reachable and blackout/availability friction. Marketing "worth up to $X"
    ignored.'
