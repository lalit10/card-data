  requires_enrollment: false
  expires: null
  notes: Pays only after $20,000 of card spend in a calendar year; captured only by heavy spenders. Paired
    with a 10,000-point bonus at the same threshold (separate entry).
- name: Anniversary bonus points ($20k spend)
  amount_usd: null
