earn:
- type: category
  key: travel_other
  rate: 8
  cap_usd: null
  cap_period: null
  portal_only: true
  notes: Chase Travel portal purchases of any travel type (flights, hotels, cars, cruises, activities).
    Modeled on travel_other as the portal channel; direct flights/hotels earn 4x (see travel_flights/travel_hotels).
    Excludes FROSCH/Valerie Wilson/Frosch International bookings. Portal prices may exceed direct booking.
- type: category
  key: travel_flights
  rate: 4
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: Flights booked directly with the airline; portal-booked flights earn 8x (see travel_other).
- type: category
  key: travel_hotels
  rate: 4
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: Hotels booked directly with the hotel; portal-booked hotels earn 8x (see travel_other).
- type: category
  key: dining
  rate: 3
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: null
- type: merchant
  key: lyft
  rate: 5
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: Limited-time through 9/30/2027 (excludes gift cards, car rentals, vehicle service centers). Reverts
    to base earn after the promo; merchant_rewards has no expires field, so the end date is noted here.
credits:
- name: Annual Travel Credit
  amount_usd: 300
  period: annual
  category: travel_other
  requires_enrollment: false
  expires: null
  notes: Automatic statement credit applied to the first $300/year of travel-category purchases (year
    = account anniversary cycle). Near-universal full capture for anyone who travels; the offsetting purchases
    do not also earn points.
- name: The Edit prepaid-stay credit
  amount_usd: 250
  period: semiannual
  category: travel_hotels
  requires_enrollment: false
  expires: null
  notes: Up to $250 twice per year ($500/year) on prepaid 2+ night "Pay Now" stays booked via The Edit
    (Chase's luxury hotel program). Captured only by users who book qualifying luxury 2+ night prepaid
    stays each half-year; low capture for most cardholders.
- name: Select-hotels Chase Travel credit (2026)
  amount_usd: 250
  period: annual
  category: travel_hotels
  requires_enrollment: false
  expires: '2026-12-31'
  notes: Up to $250 in calendar year 2026 on prepaid 2+ night stays at IHG, Montage, Pendry, Omni, Virgin
    Hotels, Minor Hotels, or Pan Pacific booked through Chase Travel. Captured only by users booking those
    specific brands; promotional (2026 only).
- name: Annual Dining Credit
  amount_usd: 150
  period: semiannual
  category: dining
  requires_enrollment: false
  expires: null
  notes: Up to $150 per half-year at select restaurants booked via OpenTable Sapphire Reserve Exclusive
    Tables; identifiable direct-restaurant purchases only (excludes gift cards and third-party delivery
    apps). Restricted restaurant list — partial capture at best for most users.
- name: StubHub / viagogo credit
  amount_usd: 150
  period: semiannual
  category: null
  requires_enrollment: true
  expires: '2027-12-31'
  notes: Up to $150 per half-year on StubHub/viagogo, one-time activation required, through 12/31/2027.
    Captured only by live-event ticket buyers who activate; worthless otherwise.
- name: Peloton Membership credit
  amount_usd: 10
  period: monthly
  category: null
  requires_enrollment: true
  expires: '2027-12-31'
  notes: Up to $10/month toward qualifying Peloton membership tiers, one-time activation required, through
    12/31/2027. Captured only by active paying Peloton members.
- name: Lyft ride credit
  amount_usd: 10
  period: monthly
  category: transit
  requires_enrollment: false
  expires: '2027-09-30'
  notes: $10/month toward Standard/Extra Comfort/XL/Black/Black SUV rides (not memberships), through 9/30/2027.
    Full capture for regular Lyft riders; forfeited monthly if unused.
- name: Global Entry / TSA PreCheck / NEXUS application fee credit
  amount_usd: 120
  period: every_4_years
  category: null
  requires_enrollment: false
  expires: null
  notes: Up to $120 once every 4 years for a trusted-traveler application fee. Captured only by travelers
    who enroll.
- name: The Shops at Chase credit (at $75k annual spend)
  amount_usd: 250
  period: annual
  category: null
  requires_enrollment: false
  expires: null
  notes: Unlocked only after $75,000 in card spend per calendar year, then redeemable at The Shops at
    Chase. Reachable by very few cardholders; the optimizer zeroes it below that spend volume.
- name: Southwest Airlines Chase Travel credit (at $75k annual spend)
  amount_usd: 500
  period: annual
  category: travel_flights
  requires_enrollment: false
  expires: null
  notes: Unlocked only after $75,000 in card spend per calendar year, then usable as a $500 Southwest
    credit via Chase Travel (requires linking the Rapid Rewards account). Reachable by very few cardholders;
    the optimizer zeroes it below that spend volume.
