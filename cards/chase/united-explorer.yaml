    MileagePlus X, DIRECTV, Merchandise Awards, and discount-site/third-party-package tickets. Narrower
    than the general travel_flights category — other airlines' tickets earn only the 1x base rate.
- type: category
  key: dining
  rate: 2
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: null
- type: category
  key: travel_hotels
  rate: 2
  cap_usd: null
  cap_period: null
  portal_only: false
  notes: Only hotel accommodations purchased directly with the hotel.
credits:
- name: Instacart monthly credit
  amount_usd: 10
  period: monthly
  category: groceries
  requires_enrollment: false
  expires: null
  notes: Up to $10/month ($120/yr) in Instacart credits; monthly forfeit.
- name: United TravelBank credit ($10k spend)
  amount_usd: 100
  period: annual
  category: null
  requires_enrollment: false
  expires: null
  notes: $100 of TravelBank cash (usable toward United airfare) once per year, only after $10,000 of card
    spend in a calendar year; TravelBank cash expires 12 months after issue. Captured by United flyers
    who reach the spend gate and use the cash in time.
- name: United Hotels credit
  amount_usd: 100
  period: annual
  category: null
  requires_enrollment: false
  expires: null
  notes: $50 each on the first two prepaid ($50+) United Hotels "Pay Now" bookings, up to $100/year. Scoped
    to the United Hotels booking channel — captured only by those who book hotels that specific way; worthless
    otherwise.
- name: Rideshare credit
  amount_usd: 60
  period: annual
  category: null
  requires_enrollment: true
  expires: null
  notes: $5/month (up to $60/year) in rideshare statement credits, enrollment required, through ~9/30/2027
    (offer file flags to re-check the end date). Captured only by regular rideshare users who enroll and
    use it monthly (no rollover).
- name: Avis/Budget credit
  amount_usd: 50
  period: annual
  category: null
  requires_enrollment: false
  expires: null
  notes: $25 each on the first two qualifying Avis/Budget rentals via cars.united.com with discount codes,
    up to $50/year. Scoped to that booking channel — captured only by car renters who book that way.
- name: JSX credit
  amount_usd: 100
  period: annual
  category: null
  requires_enrollment: false
  expires: null
  notes: $100/year toward JSX (a semi-private hop-on-jet carrier serving limited routes). Captured only
    by the small set of flyers with access to JSX routes; near-zero for most cardholders.
- name: Global Entry / TSA PreCheck / NEXUS fee credit
  amount_usd: 120
  period: every_4_years
  category: null
  requires_enrollment: false
  expires: null
  notes: One statement credit up to $120 per 4-year cycle covering a trusted-traveler application fee.
    Captured only by travelers who apply/renew.
